# ==========================================================================
# Droguería Específica — orquestación local / base de despliegue (Fase 1)
#
# Orden de arranque garantizado por healthchecks y condiciones:
#   postgres (healthy)  ->  migrate (corre y termina OK)  ->  web (arranca)
#
# Levantar todo:   docker compose up --build
# Validar config:  docker compose config
# ==========================================================================

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatorio}
    volumes:
      # Postgres 18+ guarda los datos en un subdir por versión bajo
      # /var/lib/postgresql; el volumen se monta ahí (no en .../data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - drogueria

  # Aplica migraciones ANTES de levantar la web. Corre y termina.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatorio}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - drogueria

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatorio}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - drogueria

volumes:
  postgres_data:
    driver: local

networks:
  drogueria:
    driver: bridge
