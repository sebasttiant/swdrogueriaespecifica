# ==========================================================================
# Droguería Específica — orquestación local / base de despliegue (Fase 1)
#
# Orden de arranque garantizado por healthchecks y condiciones:
#   postgres (healthy)  ->  migrate (termina OK)  ->  seed (termina OK)  ->  web
#
# Levantar/resetear local: docker compose up -d --build --force-recreate
# Validar config:  docker compose config
# ==========================================================================

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    # `max_connections` por defecto es 100. La app abre hasta 30 (ver
    # DATABASE_POOL_MAX) y todavía tienen que caber las migraciones del deploy,
    # el seed, los respaldos y cualquier `psql` de soporte, todos a la vez.
    # 200 deja aire de sobra sin costar memoria relevante en este VPS.
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatorio}
    volumes:
      # Postgres 18+ guarda los datos en un subdir por versión bajo
      # /var/lib/postgresql; el volumen se monta ahí (no en .../data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - drogueria

  # Aplica migraciones ANTES de levantar la web. Corre y termina.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatorio}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - drogueria

  # Carga datos demo/admin DESPUÉS de migrar y ANTES de levantar la web.
  seed:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: seed
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatorio}
      # Sin valor por defecto a propósito: este repositorio es público y una
      # clave escrita acá quedaría publicada. Se pasa vacía si no está definida
      # y es `seed.ts` quien decide: la exige solo cuando tiene que CREAR el
      # administrador, no en cada despliegue.
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - drogueria

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatorio}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET es obligatorio}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Commit desplegado. Va en cada evento de diagnóstico para poder responder
      # "¿este intento corrió con el arreglo o sin él?" sin deducirlo por fecha.
      # `deploy.sh` lo completa solo; el default deja claro cuándo no se sabe.
      APP_COMMIT: ${APP_COMMIT:-unknown}
      # Detalle del log de alta de pendientes: full | errors | off.
      # `full` durante un diagnóstico; `errors` para la operación normal.
      PENDING_DIAGNOSTICS: ${PENDING_DIAGNOSTICS:-errors}
    ports:
      # Puerto externo 3132 -> interno 3000. La app sigue escuchando en 3000
      # dentro del contenedor; solo se publica 3132 hacia afuera.
      - "3132:3000"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - drogueria

volumes:
  postgres_data:
    driver: local

networks:
  drogueria:
    driver: bridge
