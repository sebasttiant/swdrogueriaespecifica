<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Droguería Específica">
  <!--
    Favicon: medallón de la marca (public/logo-especifica.webp). Colores
    muestreados del logo original: verde #a1b65b, navy #254181, rojo #b10116.

    El medallón del logo está inclinado y lleva un anillo negro extra; acá va
    derecho y con un anillo menos porque a 16px esos detalles se empastan y el
    ícono deja de leerse. Se conserva lo que identifica la marca: aro verde,
    disco navy, cruz blanca y el punto rojo.

    Formato SVG (no .ico) para que escale nítido en cualquier densidad. Next
    detecta `app/icon.svg` por convención de archivo e inyecta el <link> solo,
    sin tocar `metadata` en layout.tsx.
  -->
  <circle cx="32" cy="32" r="32" fill="#a1b65b" />
  <circle cx="32" cy="32" r="27" fill="#ffffff" />
  <circle cx="32" cy="32" r="25.5" fill="#254181" />
  <path d="M25 15h14v10h10v14H39v10H25V39H15V25h10z" fill="#ffffff" />
  <circle cx="45" cy="19" r="5.5" fill="#b10116" />
</svg>
