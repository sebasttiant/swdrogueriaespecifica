name: CI (PR)

on:
  pull_request:
    branches: [main]

# Cancela corridas previas del mismo PR.
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        # Misma versión que la imagen: el build de Next incrusta
        # `NEXT_PUBLIC_APP_VERSION` al compilar, y si acá faltara, este job
        # estaría validando algo distinto de lo que se despliega.
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        run: pnpm build

  # Gate de PostgreSQL real: corre contra una base descartable que el harness
  # crea, migra y borra (ver apps/web/tests/postgres/setup.ts). Es el piso de
  # las pruebas de concurrencia de pendientes operativos.
  operational-pendings-postgres:
    name: Gate PostgreSQL · pendientes operativos
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Gate PostgreSQL
        # Base de mantenimiento del servicio; el harness crea la suya aparte.
        # DATABASE_URL NO se define acá a propósito: el harness nunca la usa.
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm test:pg:operational

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: false
          tags: drogueria-especifica-web:ci
          # SHA COMPLETO del commit. El build del cliente se marca con él, y esa
          # marca es lo único que después permite detectar que una pestaña vieja
          # sigue hablando con un servidor nuevo. Sin esto la imagen sale con
          # `unknown` y el guard no puede comparar nada.
          build-args: |
            APP_VERSION=${{ github.sha }}
