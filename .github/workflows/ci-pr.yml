name: CI (PR)

on:
  pull_request:
    branches: [main]

# Cancela corridas previas del mismo PR.
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        # Misma versión que la imagen: el build de Next incrusta
        # `NEXT_PUBLIC_APP_VERSION` al compilar, y si acá faltara, este job
        # estaría validando algo distinto de lo que se despliega.
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        run: pnpm build

  # Gate de PostgreSQL real: corre contra una base descartable que el harness
  # crea, migra y borra (ver apps/web/tests/postgres/setup.ts). Es el piso de
  # las pruebas de concurrencia de pendientes operativos.
  operational-pendings-postgres:
    name: Gate PostgreSQL · pendientes operativos
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Gate PostgreSQL
        # Base de mantenimiento del servicio; el harness crea la suya aparte.
        # DATABASE_URL NO se define acá a propósito: el harness nunca la usa.
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm test:pg:operational

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # `security-events: write` solo para subir el SARIF de Trivy a Code scanning.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build imagen web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: false
          # Deja la imagen en el daemon del runner para que Trivy la escanee.
          load: true
          tags: drogueria-especifica-web:ci
          # SHA COMPLETO del commit. El build del cliente se marca con él, y esa
          # marca es lo único que después permite detectar que una pestaña vieja
          # sigue hablando con un servidor nuevo. Sin esto la imagen sale con
          # `unknown` y el guard no puede comparar nada.
          build-args: |
            APP_VERSION=${{ github.sha }}

      # Fijado por SHA y no por tag: en marzo de 2026 se secuestraron tags de las
      # actions de Trivy en un incidente de cadena de suministro. Un tag se puede
      # mover; un SHA no.
      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      # Escanea la imagen que se despliega (paquetes de Debian + node_modules del
      # standalone). Solo bloquea lo HIGH/CRITICAL que ya tiene parche.
      - name: Trivy · imagen
        run: |
          trivy image drogueria-especifica-web:ci \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format sarif \
            --output trivy-image.sarif

      # `always()`: el reporte se sube también cuando Trivy encontró algo, que es
      # justo cuando más interesa verlo en Code scanning.
      - name: Subir SARIF de Trivy (imagen)
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # Advisories de npm sobre el lockfile. Los transitivos se corrigen con los
  # `overrides` de pnpm-workspace.yaml, no ignorándolos.
  audit:
    name: Audit de dependencias
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: pnpm audit (HIGH y CRITICAL)
        run: pnpm audit --audit-level=high

  # Trivy sobre el repositorio: vulnerabilidades del lockfile (otra base de
  # advisories que `audit`) y secretos en el árbol actual. gitleaks sigue
  # mirando el historial. No instala dependencias: le basta pnpm-lock.yaml.
  trivy-fs:
    name: Trivy · dependencias y secretos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Fijado por SHA y no por tag: en marzo de 2026 se secuestraron tags de las
      # actions de Trivy en un incidente de cadena de suministro. Un tag se puede
      # mover; un SHA no.
      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Trivy · filesystem
        run: |
          trivy fs . \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format sarif \
            --output trivy-fs.sarif

      - name: Subir SARIF de Trivy (filesystem)
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
