# ==========================================================================
# Barrido de seguridad por calendario.
#
# Existe por lo que pasó el 22/10/2026: cuatro advisories publicados entre el
# 27/09 y el 06/10 aparecieron recién al empujar un cambio que no tenía nada
# que ver. Durante tres semanas el código desplegado fue vulnerable y el CI
# estuvo en verde, porque nadie había empujado nada.
#
# Los escáneres de `ci-main` y `ci-pr` solo corren cuando alguien toca el
# repositorio. Una vulnerabilidad no espera a que alguien toque el repositorio.
#
# Corre los MISMOS escáneres que el CI, sobre `main`, todos los días. No
# construye para desplegar ni despliega: solo pregunta si lo que ya está
# corriendo sigue siendo seguro hoy.
# ==========================================================================
name: Seguridad (programada)

on:
  schedule:
    # 06:30 UTC = 01:30 en Bogotá. El hallazgo queda sobre la mesa antes de que
    # abra la droguería, no a media jornada.
    - cron: "30 6 * * *"
  # Disparable a mano: tras un incidente no se espera al próximo cron.
  workflow_dispatch:

concurrency:
  group: security-scheduled
  cancel-in-progress: true

jobs:
  audit:
    name: Audit de dependencias (programado)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: pnpm audit (HIGH y CRITICAL)
        run: pnpm audit --audit-level=high

  trivy-fs:
    name: Trivy · dependencias y secretos (programado)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Fijado por SHA y no por tag: en marzo de 2026 se secuestraron tags de
      # las actions de Trivy en un incidente de cadena de suministro. Un tag se
      # puede mover; un SHA no.
      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Trivy · filesystem
        run: |
          trivy fs . \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format sarif \
            --output trivy-fs.sarif

      - name: Subir SARIF de Trivy (filesystem)
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # La imagen se reconstruye desde el `main` de hoy a propósito. Lo que importa
  # no es la imagen que se construyó el día del merge, sino si los paquetes de
  # Debian y el standalone que están CORRIENDO tienen una CVE publicada
  # después. Fue exactamente el caso de `sharp`: viajaba dentro de la imagen y
  # el lockfile solo no lo mostraba.
  trivy-image:
    name: Trivy · imagen (programado)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build imagen web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: drogueria-especifica-web:scheduled
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Trivy · imagen
        run: |
          trivy image drogueria-especifica-web:scheduled \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format sarif \
            --output trivy-image.sarif

      - name: Subir SARIF de Trivy (imagen)
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
