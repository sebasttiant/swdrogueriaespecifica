name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo para escanear todos los commits

      - name: Gitleaks
        # v3 solo cambia el runtime a Node 24: GitHub retira Node 20 de los
        # runners el 16/09/2026 y v2 deja de funcionar ese día.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
