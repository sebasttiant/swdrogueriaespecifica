# ==========================================================================
# Dependabot — propone las actualizaciones; la compuerta de `main` decide.
#
# El barrido programado AVISA que hay una CVE; esto abre el PR que la corrige.
# Hacen falta las dos piezas: sin el barrido nadie se entera a tiempo, y sin
# esto cada parche depende de que alguien se siente a buscarlo a mano, que fue
# exactamente lo que pasó el 22/10/2026.
#
# Todo entra por PR, como cualquier cambio: el ruleset de `main` no tiene
# excepciones, tampoco para Dependabot. Los checks —audit, Trivy, CodeQL,
# Gitleaks, las suites y el build— corren sobre cada propuesta antes de que
# pueda mergearse.
# ==========================================================================
version: 2

updates:
  # ------------------------------------------------------------------------
  # Dependencias de la aplicación.
  # ------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota

    # Espera antes de proponer una versión recién publicada. Mismo criterio que
    # `minimumReleaseAge: 10080` de pnpm-workspace.yaml: un paquete comprometido
    # suele detectarse y retirarse en horas o días.
    #
    # NO CUBRE LAS ACTUALIZACIONES DE SEGURIDAD, y conviene saberlo antes de
    # que pase: GitHub aplica `cooldown` solo a las de VERSIÓN. Ante una CVE,
    # Dependabot abre el PR con el parche aunque tenga horas de publicado, y
    # entonces `pnpm install --frozen-lockfile` lo rechaza por
    # `minimumReleaseAge` y el PR nace con el CI en rojo.
    #
    # Eso NO es una falla del PR: son dos políticas tirando para lados
    # distintos, las dos a propósito. Una quiere el parche ya; la otra quiere
    # que el paquete madure una semana. Es una decisión humana, caso por caso:
    #
    #   - Si existe un parche maduro que también cierra el advisory (por
    #     ejemplo 16.4.1 en vez de 16.4.2), se usa ese y no hace falta tocar
    #     nada. Es el camino por defecto.
    #   - Si el único parche es la versión fresca y la CVE lo amerita, se agrega
    #     esa versión EXACTA a `minimumReleaseAgeExclude` en
    #     pnpm-workspace.yaml, con la fecha y el motivo, y se retira cuando
    #     cumpla los 7 días.
    #
    # Pasó el 22/10/2026 con next@16.4.2: tenía 6 días y 23 horas. Se desplegó
    # 16.4.1, que cerraba los mismos advisories y ya estaba madura.
    cooldown:
      default-days: 7

    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: ["dependencias"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

    groups:
      # Los parches entran juntos: casi nunca rompen nada, y revisarlos de a
      # uno es ruido que termina en "mergear sin mirar".
      parches:
        patterns: ["*"]
        update-types: ["patch"]

      # Los minors también se agrupan, pero APARTE: cambian comportamiento y
      # merecen una lectura propia.
      menores:
        patterns: ["*"]
        update-types: ["minor"]

    # Los MAJOR quedan fuera del agrupamiento a propósito: cada uno es su
    # propio PR, con sus propias roturas y su propia decisión. Agruparlos sería
    # pedir que se mergeen sin leer, que es lo contrario de esto.
    ignore:
      # Prisma 8 está en release candidate (22/10/2026). Un RC no entra a un
      # sistema que mueve inventario y plata. Retirar esta regla cuando salga
      # 8.0.0 estable y se planifique la migración.
      - dependency-name: prisma
        versions: ["8.x"]
      - dependency-name: "@prisma/client"
        versions: ["8.x"]
      - dependency-name: "@prisma/adapter-pg"
        versions: ["8.x"]

  # ------------------------------------------------------------------------
  # Las propias GitHub Actions.
  #
  # Es la superficie que más se olvida y la que más duele: una action es código
  # de terceros con acceso al pipeline. En marzo de 2026 se secuestraron tags
  # de las actions de Trivy, y por eso las de este repo van fijadas por SHA.
  # Dependabot entiende ese formato y propone el SHA nuevo con su changelog.
  # ------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels: ["dependencias", "ci"]
    commit-message:
      prefix: "chore(ci)"
