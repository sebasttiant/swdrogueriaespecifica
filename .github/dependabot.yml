# ==========================================================================
# Dependabot — propone las actualizaciones; la compuerta de `main` decide.
#
# El barrido programado AVISA que hay una CVE; esto abre el PR que la corrige.
# Hacen falta las dos piezas: sin el barrido nadie se entera a tiempo, y sin
# esto cada parche depende de que alguien se siente a buscarlo a mano, que fue
# exactamente lo que pasó el 22/10/2026.
#
# Todo entra por PR, como cualquier cambio: el ruleset de `main` no tiene
# excepciones, tampoco para Dependabot. Los checks —audit, Trivy, CodeQL,
# Gitleaks, las suites y el build— corren sobre cada propuesta antes de que
# pueda mergearse.
# ==========================================================================
version: 2

updates:
  # ------------------------------------------------------------------------
  # Dependencias de la aplicación.
  # ------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota

    # Espera antes de proponer una versión recién publicada. Es el MISMO
    # criterio que `minimumReleaseAge: 10080` de pnpm-workspace.yaml: un
    # paquete comprometido suele detectarse y retirarse en horas o días.
    #
    # Sin esto, Dependabot propondría versiones que `pnpm install` después
    # rechaza por demasiado nuevas, y el PR nacería roto.
    cooldown:
      default-days: 7

    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: ["dependencias"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

    groups:
      # Los parches entran juntos: casi nunca rompen nada, y revisarlos de a
      # uno es ruido que termina en "mergear sin mirar".
      parches:
        patterns: ["*"]
        update-types: ["patch"]

      # Los minors también se agrupan, pero APARTE: cambian comportamiento y
      # merecen una lectura propia.
      menores:
        patterns: ["*"]
        update-types: ["minor"]

    # Los MAJOR quedan fuera del agrupamiento a propósito: cada uno es su
    # propio PR, con sus propias roturas y su propia decisión. Agruparlos sería
    # pedir que se mergeen sin leer, que es lo contrario de esto.
    ignore:
      # Prisma 8 está en release candidate (22/10/2026). Un RC no entra a un
      # sistema que mueve inventario y plata. Retirar esta regla cuando salga
      # 8.0.0 estable y se planifique la migración.
      - dependency-name: prisma
        versions: ["8.x"]
      - dependency-name: "@prisma/client"
        versions: ["8.x"]
      - dependency-name: "@prisma/adapter-pg"
        versions: ["8.x"]

  # ------------------------------------------------------------------------
  # Las propias GitHub Actions.
  #
  # Es la superficie que más se olvida y la que más duele: una action es código
  # de terceros con acceso al pipeline. En marzo de 2026 se secuestraron tags
  # de las actions de Trivy, y por eso las de este repo van fijadas por SHA.
  # Dependabot entiende ese formato y propone el SHA nuevo con su changelog.
  # ------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels: ["dependencias", "ci"]
    commit-message:
      prefix: "chore(ci)"
