packages:
  - "apps/*"
  - "packages/*"

# Overrides de seguridad: fuerzan versiones parcheadas de dependencias
# TRANSITIVAS reportadas por `pnpm audit`, scopeadas SOLO a las versiones
# vulnerables. Los destinos son EXACTOS (con más de 7 días publicados): un `^`
# podría resolver a un parche recién salido.
#   uuid <11.1.1             -> bounds check (vía exceljs). MAJOR 8->11: exceljs
#     4.4.0 usa solo `uuidv4()` (no v3/v5/v6 con buf), verificado con smoke test
#     + prueba E2E del export .xlsx antes de mergear.
#   brace-expansion 1.x/2.x/5.x -> DoS: cada parche queda en su major (minimatch)
#   browserslist <4.28.7     -> GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g
#   fast-uri <3.1.6          -> host confusion / parsing en AJV (vía Prisma)
#   js-yaml <4.3.2           -> GHSA-2883-xcg3-v3hh y anteriores del 4.x
#   mysql2 <3.23.1           -> GHSA-3f6p-5ww8-9rcr + GHSA-rgwj-5xj2-c3m3 (CLI de Prisma)
#   nanoid <3.3.18           -> GHSA-2v37-7h3g-55p8
#   deepmerge-ts 7.x (solo bajo @prisma/config) -> GHSA-ggr8-5vv4-36mx, parche
#     solo en 8.x. Prisma lo usa como `merger` de c12 con dos objetos planos.
overrides:
  "uuid@<11.1.1": "^11.1.1"
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
  "browserslist@>=4.0.0 <4.28.7": "4.28.7"
  "fast-uri@>=3.0.0 <3.1.6": "3.1.6"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "mysql2@>=3.0.0 <3.23.1": "3.23.1"
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  "@prisma/config@7.10.0>deepmerge-ts": "8.0.2"

# Allowlist explícita de dependencias autorizadas a ejecutar build scripts.
# Toolchain oficial, necesario:
#   esbuild -> tsx/vitest · unrs-resolver -> ESLint · sharp -> next/image
#   prisma / @prisma/engines -> CLI y Migrate · @node-rs/argon2 -> hash nativo
# `allowBuilds` es la única forma desde pnpm 11 (se eliminó
# `onlyBuiltDependencies`), y pnpm 12 corta el install si la clave vieja sigue.
allowBuilds:
  "@node-rs/argon2": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Venían de `.npmrc`, pero desde pnpm 11 ese archivo solo aporta auth/registry:
# ahí eran inertes. `package-manager-strict` se eliminó y su valor era el default.
engineStrict: true
preferFrozenLockfile: true

# Defensa de cadena de suministro: pnpm no resuelve versiones publicadas hace
# menos de 7 días (10080 minutos). Un paquete comprometido suele detectarse y
# retirarse en horas o días; esperar una semana deja pasar ese margen.
# No agregar `minimumReleaseAgeExclude` para apurar un bump: si la versión es
# demasiado nueva, se usa el parche maduro anterior.
minimumReleaseAge: 10080
