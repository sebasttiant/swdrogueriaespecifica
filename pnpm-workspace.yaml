packages:
  - "apps/*"
  - "packages/*"

# Overrides de seguridad: fuerzan versiones parcheadas de dependencias
# TRANSITIVAS reportadas por `pnpm audit --prod`, scopeadas SOLO a las versiones
# vulnerables. hono/@hono/node-server/postcss quedan dentro del mismo major.
#   hono <4.12.25            -> GHSA-* (CORS wildcard con credenciales, etc.)
#   @hono/node-server <1.19.13 -> serveStatic middleware bypass
#   postcss <8.5.10          -> XSS en el stringify de CSS
#   uuid <11.1.1             -> bounds check (vía exceljs). MAJOR 8->11: exceljs
#     4.4.0 usa solo `uuidv4()` (no v3/v5/v6 con buf), verificado con smoke test
#     + prueba E2E del export .xlsx antes de mergear.
#   fast-uri <=3.1.3         -> host confusion en AJV (vía Prisma)
#   brace-expansion          -> DoS: los parches respetan los rangos de minimatch
overrides:
  "hono@<4.12.25": "^4.12.25"
  "@hono/node-server@<1.19.13": "^1.19.13"
  "postcss@<8.5.10": "^8.5.10"
  "uuid@<11.1.1": "^11.1.1"
  "fast-uri@>=3.0.0 <=3.1.3": "^3.1.4"
  "brace-expansion@>=2.0.0 <2.1.2": "^2.1.2"
  "brace-expansion@<1.1.16": "^1.1.16"
  "brace-expansion@>=5.0.0 <=5.0.7": "^5.0.8"

allowBuilds:
  "@node-rs/argon2": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Allowlist explícita de dependencias autorizadas a ejecutar build scripts.
# Toolchain oficial, necesario:
#   esbuild -> tsx/vitest · unrs-resolver -> ESLint · sharp -> next/image
#   prisma / @prisma/engines -> CLI y Migrate · @node-rs/argon2 -> hash nativo
onlyBuiltDependencies:
  - "@node-rs/argon2"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - jsdom@30.0.1
